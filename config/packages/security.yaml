security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        staff_users:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        staff:
            pattern: ^/staff
            lazy: true
            provider: staff_users
            user_checker: App\Security\StaffUserChecker
            form_login:
                login_path: staff_login
                check_path: staff_login
                default_target_path: staff_dashboard
                enable_csrf: true
            logout:
                path: staff_logout
                target: staff_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600
                path: /staff
        patient:
            pattern: ^/
            lazy: true
            security: false
    role_hierarchy:
        ROLE_ADMIN: ROLE_RECEPTIONIST
    access_control:
        - { path: ^/staff/login$, roles: PUBLIC_ACCESS }
        - { path: ^/staff/admin, roles: ROLE_ADMIN }
        - { path: ^/staff, roles: ROLE_RECEPTIONIST }
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
